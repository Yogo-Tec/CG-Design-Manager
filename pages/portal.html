<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Approval | CGDM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f3f5f9;color:#182136;font-family:Inter,system-ui}.portal{max-width:860px;margin:40px auto;padding:16px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}.brand span{background:#315bea;color:#fff;padding:10px;border-radius:10px;font-weight:800}.card{border:1px solid #e2e7ef;border-radius:16px;box-shadow:0 12px 40px #1018280d}.proof{height:300px;border-radius:12px;background:linear-gradient(135deg,#1d2951,#4969dc);display:grid;place-items:center;color:#fff}.badge{font-size:10px}.btn{font-size:12px;font-weight:700;padding:10px 16px}</style></head><body><main class="portal"><div class="brand"><span>CG</span><strong>CG-Designer Manager</strong></div><div id="content" class="card p-4"><div class="text-center p-5"><span class="spinner-border"></span><p class="mt-3 text-secondary">Loading approval request…</p></div></div></main><script type="module">const q=s=>document.querySelector(s),token=new URLSearchParams(location.search).get("token")||"demo-client-token";try{const r=await fetch(`/api/portal/${encodeURIComponent(token)}`),p=await r.json();if(!r.ok)throw new Error(p.message);const d=p.data;q("#content").innerHTML=`<div class="d-flex justify-content-between align-items-start mb-4"><div><small class="text-primary fw-bold">CLIENT APPROVAL</small><h1 class="h4 mt-1">${d.project.name}</h1><p class="text-secondary small mb-0">${d.project.client} · Proof version ${d.proof.version}</p></div><span class="badge text-bg-warning">Ready for approval</span></div><div class="proof mb-4"><div class="text-center"><div class="display-5">CG</div><p>Secure proof preview</p></div></div><form id="decision"><label class="form-label small fw-bold">Feedback (optional)</label><textarea class="form-control mb-3" name="feedback" rows="3" placeholder="Share clear feedback with the design team"></textarea><div class="d-flex gap-2 justify-content-end"><button class="btn btn-outline-danger" name="decision" value="CHANGES_REQUESTED">Request changes</button><button class="btn btn-success" name="decision" value="APPROVED">Approve proof</button></div></form>`;q("#decision").addEventListener("submit",async e=>{e.preventDefault();const button=e.submitter,feedback=new FormData(e.currentTarget).get("feedback");const response=await fetch(`/api/portal/${encodeURIComponent(token)}/decision`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({decision:button.value,feedback})});if(response.ok)q("#content").innerHTML=`<div class="text-center p-5"><div class="display-5 text-success">✓</div><h1 class="h4 mt-3">Decision recorded</h1><p class="text-secondary">Thank you. The design team has been notified.</p></div>`})}catch(e){q("#content").innerHTML=`<div class="alert alert-danger m-4">${e.message}</div>`}</script></body></html>
