<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose password | CGDM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/assets/css/login.css" rel="stylesheet"></head><body><main class="login-layout"><section class="login-brand-panel"><div class="brand-lockup"><span>CG</span><strong>CGDM</strong></div><div class="brand-message"><p class="eyebrow">Secure access</p><h1>Choose a new workspace password.</h1></div></section><section class="login-form-panel"><form class="login-card" id="resetForm"><p class="eyebrow">Password recovery</p><h2>Create a new password</h2><p class="subcopy">Use at least 10 characters and avoid reusing your database password.</p><div id="message" class="alert d-none" role="alert"></div><div class="mb-3"><label class="form-label" for="password">New password</label><input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="10" required></div><div class="mb-3"><label class="form-label" for="confirmPassword">Confirm password</label><input class="form-control" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required></div><button class="btn btn-primary w-100" type="submit">Update password</button><p class="text-center mt-3"><a href="/">Back to sign in</a></p></form></section></main><script type="module" src="/assets/js/reset-password.js"></script></body></html>
